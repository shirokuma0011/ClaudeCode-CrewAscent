<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ssm-t">
  <title id="ssm-t">制作に含まれる範囲と、含まれない範囲を並べた図</title>
  <rect width="1200" height="700" fill="#FCFDFE"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#5A6B82" letter-spacing="1">
    <text x="70" y="70">INCLUDED</text>
    <text x="700" y="70">SEPARATE ESTIMATE</text>
  </g>
  <line x1="70" y1="88" x2="560" y2="88" stroke="#087F78" stroke-width="3"/>
  <line x1="700" y1="88" x2="1130" y2="88" stroke="#C98213" stroke-width="3"/>
  <g fill="#DCE8FB" stroke="#1F64D1" stroke-width="1.5">
    <rect x="70" y="120" width="230" height="88" rx="4"/><rect x="330" y="120" width="230" height="88" rx="4"/>
    <rect x="70" y="232" width="230" height="88" rx="4"/><rect x="330" y="232" width="230" height="88" rx="4"/>
    <rect x="70" y="344" width="230" height="88" rx="4"/><rect x="330" y="344" width="230" height="88" rx="4"/>
  </g>
  <g fill="#0C1D2E" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    <text x="92" y="158">情報構成</text><text x="352" y="158">スマホ表示</text>
    <text x="92" y="270">問い合わせ導線</text><text x="352" y="270">基本SEO設定</text>
    <text x="92" y="382">SSL・公開確認</text><text x="352" y="382">納品前チェック</text>
  </g>
  <g fill="#5A6B82" font-family="system-ui, sans-serif" font-size="14">
    <text x="92" y="184">読む順番を設計します</text><text x="352" y="184">320pxから確認します</text>
    <text x="92" y="296">読み終えた場所に置きます</text><text x="352" y="296">title・説明文・見出し構造</text>
    <text x="92" y="408">通信と表示を確認します</text><text x="352" y="408">表示崩れとリンク切れ</text>
  </g>
  <g fill="#FCF1DE" stroke="#C98213" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="700" y="120" width="430" height="66" rx="4"/><rect x="700" y="206" width="430" height="66" rx="4"/>
    <rect x="700" y="292" width="430" height="66" rx="4"/><rect x="700" y="378" width="430" height="66" rx="4"/>
  </g>
  <g fill="#0C1D2E" font-family="system-ui, sans-serif" font-size="17" font-weight="700">
    <text x="722" y="160">高度な予約・会員・決済・CMS</text>
    <text x="722" y="246">継続的な広告運用</text>
    <text x="722" y="332">本格的な取材・写真撮影</text>
    <text x="722" y="418">商標調査を含むロゴ開発</text>
  </g>
  <line x1="630" y1="110" x2="630" y2="460" stroke="#D6DEE9" stroke-width="2"/>
  <g transform="translate(70,500)">
    <text font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#5A6B82" letter-spacing="1">PLAN RANGE</text>
    <line x1="0" y1="18" x2="1060" y2="18" stroke="#D6DEE9" stroke-width="2"/>
    <g font-family="system-ui, sans-serif">
      <rect x="0" y="42" width="230" height="56" fill="#E7F0FE" stroke="#1F64D1" stroke-width="1.5" rx="4"/>
      <text x="20" y="70" font-size="16" font-weight="700" fill="#0C1D2E">はじめて</text>
      <text x="20" y="90" font-size="13" fill="#5A6B82">1ページ</text>
      <rect x="256" y="42" width="230" height="56" fill="#DCF0EE" stroke="#087F78" stroke-width="1.5" rx="4"/>
      <text x="276" y="70" font-size="16" font-weight="700" fill="#0C1D2E">シンプル</text>
      <text x="276" y="90" font-size="13" fill="#5A6B82">3ページ前後</text>
      <rect x="512" y="42" width="230" height="56" fill="#E7F0FE" stroke="#17509E" stroke-width="1.5" rx="4"/>
      <text x="532" y="70" font-size="16" font-weight="700" fill="#0C1D2E">標準</text>
      <text x="532" y="90" font-size="13" fill="#5A6B82">5ページ前後</text>
      <rect x="768" y="42" width="230" height="56" fill="#EDE7F9" stroke="#7354B8" stroke-width="1.5" rx="4"/>
      <text x="788" y="70" font-size="16" font-weight="700" fill="#0C1D2E">おまかせ</text>
      <text x="788" y="90" font-size="13" fill="#5A6B82">＋文章・画像・簡易ロゴ</text>
    </g>
  </g>
</svg>

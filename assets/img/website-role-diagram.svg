<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="wrd-t">
  <title id="wrd-t">SNS・地図サービス・紹介・検索の四つの入口から訪れた人が、Webサイトで内容を確かめ、問い合わせへ進む流れの図</title>
  <rect width="1200" height="720" fill="#FCFDFE"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#5A6B82" letter-spacing="1.5">
    <text x="60" y="52">ENTRY</text><text x="520" y="52">CONFIRM</text><text x="980" y="52">ACTION</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <g fill="#fff" stroke="#D6DEE9" stroke-width="1.5">
      <rect x="60" y="80" width="220" height="76" rx="4"/><rect x="60" y="184" width="220" height="76" rx="4"/>
      <rect x="60" y="288" width="220" height="76" rx="4"/><rect x="60" y="392" width="220" height="76" rx="4"/>
    </g>
    <g font-size="18" font-weight="700" fill="#0C1D2E">
      <text x="84" y="115">SNS</text><text x="84" y="219">地図・店舗情報</text><text x="84" y="323">紹介・名刺</text><text x="84" y="427">検索</text>
    </g>
    <g font-size="13" fill="#5A6B82">
      <text x="84" y="138">日々の活動・雰囲気</text><text x="84" y="242">場所・営業時間・経路</text>
      <text x="84" y="346">人づてに名前を聞く</text><text x="84" y="450">サービス名・地域で探す</text>
    </g>
  </g>
  <g stroke="#9AA9BD" stroke-width="2" fill="none">
    <path d="M280 118 L 380 118 L 380 300 L 470 300"/>
    <path d="M280 222 L 350 222 L 350 300 L 470 300"/>
    <path d="M280 326 L 350 326 L 350 300 L 470 300"/>
    <path d="M280 430 L 380 430 L 380 300 L 470 300"/>
  </g>
  <circle cx="470" cy="300" r="5" fill="#1F64D1"/>
  <rect x="500" y="120" width="380" height="360" rx="5" fill="#E7F0FE" stroke="#1F64D1" stroke-width="2.5"/>
  <g font-family="system-ui, sans-serif">
    <text x="528" y="162" font-size="21" font-weight="700" fill="#0C1D2E">Webサイト</text>
    <text x="528" y="186" font-size="13" fill="#17509E">読み手が知りたい順番で説明できる場所</text>
    <g fill="#fff" stroke="#A9C9F7" stroke-width="1.5">
      <rect x="528" y="208" width="324" height="46" rx="3"/><rect x="528" y="264" width="324" height="46" rx="3"/>
      <rect x="528" y="320" width="324" height="46" rx="3"/><rect x="528" y="376" width="324" height="46" rx="3"/>
    </g>
    <g font-size="15" font-weight="600" fill="#0C1D2E">
      <text x="548" y="237">事業内容・対応範囲</text><text x="548" y="293">料金の考え方</text>
      <text x="548" y="349">進め方・よくある質問</text><text x="548" y="405">連絡方法・受付時間</text>
    </g>
    <g font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#7E8FA5">
      <text x="822" y="237">01</text><text x="822" y="293">02</text><text x="822" y="349">03</text><text x="822" y="405">04</text>
    </g>
  </g>
  <path d="M880 300 L 960 300" stroke="#087F78" stroke-width="2.5" fill="none"/>
  <circle cx="960" cy="300" r="5" fill="#087F78"/>
  <g font-family="system-ui, sans-serif">
    <g fill="#DCF0EE" stroke="#087F78" stroke-width="1.5">
      <rect x="980" y="200" width="170" height="62" rx="4"/><rect x="980" y="272" width="170" height="62" rx="4"/>
      <rect x="980" y="344" width="170" height="62" rx="4"/>
    </g>
    <g font-size="16" font-weight="700" fill="#0C1D2E">
      <text x="1002" y="230">問い合わせ</text><text x="1002" y="302">予約・来店</text><text x="1002" y="374">見送る判断</text>
    </g>
    <g font-size="12" fill="#5A6B82">
      <text x="1002" y="250">フォーム・電話・LINE</text><text x="1002" y="322">場所と時間を確認して</text><text x="1002" y="394">合わないと分かることも成果</text>
    </g>
  </g>
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#D6DEE9" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#5A6B82">
    <text x="60" y="576">Webサイトは、入口ではなく「確かめる場所」として働きます。</text>
    <text x="60" y="602">公開しただけで見つけてもらえるわけではありません。SNSや名刺など、既にある入口から案内する導線が必要です。</text>
    <text x="60" y="628">検索順位・アクセス数・問い合わせ件数を保証するものではありません。</text>
  </g>
</svg>
